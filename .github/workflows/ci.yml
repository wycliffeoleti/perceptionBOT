name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add ROS2 apt repository
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg lsb-release software-properties-common
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt-get update

      - name: Install ROS2 + MoveIt + ros_gz + dev tools
        run: |
          sudo apt-get install -y \
            ros-jazzy-ros-base \
            ros-jazzy-moveit \
            ros-jazzy-moveit-task-constructor-core \
            ros-jazzy-ros2-control \
            ros-jazzy-ros2-controllers \
            ros-jazzy-image-geometry \
            ros-jazzy-cv-bridge \
            ros-jazzy-image-transport \
            ros-jazzy-message-filters \
            ros-jazzy-tf2-ros \
            ros-jazzy-tf2-geometry-msgs \
            python3-colcon-common-extensions \
            python3-rosdep python3-vcstool

      - name: Cache ONNX Runtime (CPU)
        id: cache-ort
        uses: actions/cache@v4
        with:
          path: /opt/onnxruntime
          key: onnxruntime-cpu-1.20.1

      - name: Install ONNX Runtime (CPU build for CI)
        if: steps.cache-ort.outputs.cache-hit != 'true'
        run: |
          curl -fL "https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-x64-1.20.1.tgz" -o /tmp/ort.tgz
          sudo mkdir -p /opt/onnxruntime
          tar -xzf /tmp/ort.tgz -C /tmp
          sudo cp -r /tmp/onnxruntime-linux-x64-1.20.1/* /opt/onnxruntime/

      - name: Build (colcon)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install \
            --packages-skip franka_description \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Test (colcon)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-skip franka_description \
            --event-handlers console_cohesion+
          colcon test-result --verbose
