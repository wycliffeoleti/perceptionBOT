services:
  perceptionbot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: perceptionbot:dev
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all,graphics,compute,utility,display
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:ro
      - ../.demo_bag:/workspace/.demo_bag
    network_mode: host
    stdin_open: true
    tty: true
    command: ["bash", "-lc", "scripts/run_demo.sh"]
